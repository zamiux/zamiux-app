<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b223d" />
    <meta name="description" content="ساخت حساب کاربری در وب‌سایت Mohsen Zamani" />
    <title>ثبت‌نام | Mohsen Zamani</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/login.css" rel="stylesheet" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-main register-main" aria-labelledby="register-title">
        <div class="login-form-shell">
          <a class="form-brand" href="index.html" aria-label="Mohsen Zamani، صفحه اصلی">
            <span class="brand-symbol" aria-hidden="true"><i class="bi bi-stars"></i></span>
            <span>Mohsen Zamani</span>
          </a>

          <div class="form-heading">
            <span class="form-kicker"><i class="bi bi-person-plus" aria-hidden="true"></i> عضویت در سایت</span>
            <h2 id="register-title">ساخت حساب کاربری</h2>
            <p>اطلاعاتت را وارد کن تا حساب جدیدت را بسازیم.</p>
          </div>

          <form id="registerForm" class="login-form auth-form" data-auth-message="فرم ثبت‌نام هنوز به سامانهٔ احراز هویت متصل نشده است.">
            <div class="form-field">
              <label for="registerEmail">آدرس ایمیل</label>
              <div class="input-wrap">
                <i class="bi bi-envelope input-icon" aria-hidden="true"></i>
                <input
                  id="registerEmail"
                  name="email"
                  type="email"
                  autocomplete="email"
                  placeholder="name@example.com"
                  required
                />
              </div>
            </div>

            <div class="form-field">
              <label for="registerPassword">کلمه عبور</label>
              <div class="input-wrap password-wrap">
                <i class="bi bi-key input-icon" aria-hidden="true"></i>
                <input
                  id="registerPassword"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  placeholder="حداقل ۸ کاراکتر"
                  minlength="8"
                  data-password-source
                  required
                />
                <button class="password-toggle" type="button" data-password-target="registerPassword" aria-label="نمایش کلمه عبور" aria-pressed="false">
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div class="form-field">
              <label for="confirmPassword">تکرار کلمه عبور</label>
              <div class="input-wrap password-wrap">
                <i class="bi bi-shield-lock input-icon" aria-hidden="true"></i>
                <input
                  id="confirmPassword"
                  name="confirmPassword"
                  type="password"
                  autocomplete="new-password"
                  placeholder="کلمه عبور را دوباره وارد کن"
                  data-password-confirm
                  required
                />
                <button class="password-toggle" type="button" data-password-target="confirmPassword" aria-label="نمایش تکرار کلمه عبور" aria-pressed="false">
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div class="form-field captcha-field">
              <label for="registerCaptchaAnswer">پاسخ این عبارت را وارد کن</label>
              <div class="captcha-row">
                <div class="captcha-challenge">
                  <i class="bi bi-patch-question" aria-hidden="true"></i>
                  <span data-captcha-question aria-live="polite"></span>
                  <button class="captcha-refresh" type="button" data-captcha-refresh aria-label="ساخت عبارت تازه">
                    <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                  </button>
                </div>
                <div class="input-wrap captcha-input-wrap">
                  <i class="bi bi-calculator input-icon" aria-hidden="true"></i>
                  <input
                    id="registerCaptchaAnswer"
                    name="captcha"
                    type="text"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="پاسخ"
                    data-captcha-answer
                    required
                  />
                </div>
              </div>
            </div>

            <button class="login-submit" type="submit">
              <span>ساخت حساب کاربری</span>
              <i class="bi bi-arrow-left" aria-hidden="true"></i>
            </button>
            <p class="login-status" data-auth-status role="status" aria-live="polite" hidden></p>
          </form>

          <p class="register-prompt">قبلاً حساب ساخته‌ای؟ <a href="login.html">وارد شو</a></p>
          <a class="back-home" href="index.html">
            <i class="bi bi-arrow-right" aria-hidden="true"></i><span>بازگشت به صفحه اصلی</span>
          </a>
        </div>
      </section>
    </main>

    <script src="js/auth.js"></script>
  </body>
</html>
